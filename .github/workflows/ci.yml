name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  paquet:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vérifier le format Swift
        run: git ls-files -z '*.swift' | xargs -0 swift format lint --strict
      - name: Tester le paquet
        run: swift test --package-path Paquets/PersilladeCore

  app:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compiler et tester sur iPhone
        run: |
          xcodebuild -version
          simulateur=$(xcrun simctl create "Persillade CI" com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-27-0)
          trap 'xcrun simctl delete "$simulateur"' EXIT
          bash .github/scripts/preparer-phototheque-test.sh "$simulateur"
          xcodebuild -project Persillade.xcodeproj -scheme Persillade \
            -destination "platform=iOS Simulator,id=$simulateur" \
            -derivedDataPath .build/DerivedData -parallel-testing-enabled NO build test
      - name: Compiler pour un iPhone sans signer
        run: |
          xcodebuild -project Persillade.xcodeproj -scheme Persillade \
            -destination 'generic/platform=iOS' -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
