<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Persillade, maquettes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:none}
body{font-family:system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;background:#fff}
.ec{--page:#FFFFFF;--page2:#F1F4EE;--trait:#DCE3D8;--encre:#12211A;--encre2:#53635A;--persil:#0F6B3A;--surPersil:#FFFFFF;--tomate:#B8261B;--beurre:#FFE48F;--surBeurre:#4A3800;--beurreTexte:#7A5600;--fl:#3F7A1F;--bo:#8A5A16;--cr:#3A6FB0;--vi:#B03A5B;--po:#0E7C86;--es:#7A5C3A;--su:#7A4FA8;--sg:#2383A3;--bs:#B4542A;--hy:#5A6B86;--au:#53635A;
--verre:rgba(255,255,255,.74);--verreB:rgba(255,255,255,.9);--verreO:rgba(10,30,18,.14);--verreSel:rgba(20,50,32,.10);--ombre:rgba(8,28,16,.16);
position:relative;width:393px;height:852px;overflow:hidden;background:var(--page);color:var(--encre);font-size:17px;line-height:22px;letter-spacing:-.2px}
.ec.sombre{--page:#0B120E;--page2:#16201A;--trait:#2B3730;--encre:#F0F5EC;--encre2:#A6B6AA;--persil:#7FD38B;--surPersil:#06210F;--tomate:#FF9285;--beurre:#4D3C08;--surBeurre:#FFE7A0;--beurreTexte:#FFDC7A;--fl:#A8D86A;--bo:#E3B56B;--cr:#8FBDF0;--vi:#F293AE;--po:#6FCFD6;--es:#D2B48C;--su:#C6A4EE;--sg:#7FCBE3;--bs:#F2A27C;--hy:#AEBED6;--au:#A6B6AA;
--verre:rgba(30,41,34,.72);--verreB:rgba(255,255,255,.22);--verreO:rgba(0,0,0,.4);--verreSel:rgba(255,255,255,.13);--ombre:rgba(0,0,0,.5)}
.ic{display:inline-block;background:currentColor;-webkit-mask:var(--i) center/contain no-repeat;mask:var(--i) center/contain no-repeat;flex:none}
/* typographie : largeurs SF mesurées (compressed = wdth 47, condensed = wdth 60) */
.cp{font-stretch:47%;font-weight:870;letter-spacing:0}
.cd{font-stretch:60%;font-weight:870;letter-spacing:0}
.geant{font-size:44px;line-height:44px}.t1{font-size:34px;line-height:36px}.t2{font-size:24px;line-height:26px}.t3{font-size:22px;line-height:23px}
.sub{font-size:15px;line-height:20px;letter-spacing:-.15px;color:var(--encre2)}.foot{font-size:13px;line-height:18px;letter-spacing:-.05px;color:var(--encre2)}
.sb{font-weight:600}.num{font-variant-numeric:tabular-nums}
/* barre d'état */
.stat{position:absolute;inset:0 0 auto 0;height:59px;z-index:60;pointer-events:none}
.stat .h{position:absolute;left:52px;top:18px;font-weight:600;font-size:17px;line-height:22px;letter-spacing:-.2px}
.stat .d{position:absolute;right:32px;top:19px;display:flex;gap:5px;align-items:center}
.ile{position:absolute;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:19px;background:#000}
.acc{position:absolute;left:50%;bottom:8px;width:139px;height:5px;margin-left:-69.5px;border-radius:3px;background:var(--encre);z-index:70}
/* verre */
.verre{background:var(--verre);-webkit-backdrop-filter:blur(20px) saturate(190%);backdrop-filter:blur(20px) saturate(190%);box-shadow:inset .7px .7px .5px var(--verreB),inset -.7px -.7px .5px var(--verreB),inset 0 0 0 .5px var(--verreO),0 6px 22px var(--ombre)}
.plein{background:var(--persil);color:var(--surPersil);box-shadow:inset .7px .7px .5px rgba(255,255,255,.35),inset -.7px -.7px .5px rgba(255,255,255,.2),0 6px 20px var(--ombre)}
.rond{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;flex:none}
.nav{position:absolute;top:59px;left:16px;right:16px;height:44px;display:flex;align-items:center;gap:10px;z-index:50}
.nav .esp{flex:1}
.groupe{display:flex;height:44px;border-radius:22px;padding:0 2px}.groupe>*{width:42px;height:44px;display:grid;place-items:center}
.titre{position:absolute;left:16px;right:16px;top:113px}
.titre .geant{display:block}
/* onglets */
.onglets{position:absolute;left:21px;right:21px;bottom:21px;height:62px;display:flex;gap:10px;z-index:50}
.onglets .caps{flex:1;border-radius:31px;display:flex;padding:4px}
.onglets .o{flex:1;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;line-height:13px;font-weight:600;letter-spacing:0;position:relative}
.onglets .o.s{background:var(--verreSel);color:var(--persil)}
.onglets .rech{width:62px;height:62px;border-radius:31px;display:grid;place-items:center}
.pastille{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--persil);color:var(--surPersil);font-size:12px;line-height:18px;text-align:center;font-weight:700;padding:0 5px}
.accessoire{position:absolute;left:21px;right:21px;bottom:93px;height:52px;border-radius:26px;display:flex;align-items:center;padding:0 5px 0 16px;gap:10px;z-index:50}
.accessoire .b{height:44px;margin:0;border-radius:22px;padding:0 18px;display:flex;align-items:center;gap:7px;font-weight:650;font-size:16px;white-space:nowrap;letter-spacing:-.2px}
.accessoire .x{flex:1;min-width:0;line-height:17px;font-size:15px;font-weight:600;letter-spacing:-.2px}.accessoire .x small{display:block;font-size:12px;line-height:15px;font-weight:450;color:var(--encre2);letter-spacing:0}
.bord{position:absolute;left:0;right:0;z-index:40;pointer-events:none}
.bord.bas{bottom:0;height:120px;background:linear-gradient(to top,color-mix(in srgb,var(--page) 88%,transparent),transparent)}
.bord.haut{top:0;height:112px;background:linear-gradient(to bottom,var(--page) 52%,color-mix(in srgb,var(--page) 0%,transparent))}
/* recettes */
.lr{position:relative;display:flex;height:96px;align-items:stretch}
.lr .pl{flex:none;display:block}
.lr .tx{flex:1;min-width:0;padding:0 0 0 14px;display:flex;flex-direction:column;justify-content:center;gap:3px;border-bottom:.5px solid var(--trait)}
.lr .act{width:60px;display:grid;place-items:center;border-bottom:.5px solid var(--trait)}
.coche{width:30px;height:30px;border-radius:15px;display:grid;place-items:center}
.coche.v{border:2px solid var(--persil);color:var(--persil)}.coche.p{background:var(--persil);color:var(--surPersil)}
/* colonne de pesée */
.li{display:flex;min-height:46px;align-items:center;position:relative}
.li .q{width:92px;flex:none;text-align:right;padding-right:14px;font-size:22px;line-height:24px;color:var(--encre);white-space:nowrap}
.li .q.emp{display:flex;flex-direction:column;align-items:flex-end;line-height:21px}.li .q.emp small{font-size:15px;line-height:16px;margin:0}
.li .q small{font-size:17px;font-weight:700;margin-left:2px}
.li .n{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;border-bottom:.5px solid var(--trait);padding:5px 0}
.li .d{align-self:stretch;display:flex;align-items:center;gap:3px;border-bottom:.5px solid var(--trait);padding-right:16px}
.li.fin .n,.li.fin .d{border-bottom-color:transparent}
/* rayons */
.ray{height:36px;display:flex;align-items:center;font-size:18px;line-height:22px;background:var(--page2);color:var(--encre)}
.ray .s{width:92px;padding-right:14px;display:flex;justify-content:flex-end}
.ray .c{margin-left:auto;padding-right:20px;font-size:16px;color:var(--encre2)}
.mini .pl,.pl.m22{width:22px;height:22px;border-radius:5px;display:block}
.lc{min-height:52px}
.li .cc{width:56px;align-self:stretch;display:grid;place-items:center;border-bottom:.5px solid var(--trait);color:var(--persil);padding-right:4px}
.li.fin .cc{border-bottom-color:transparent}
.li .cc.gris{color:var(--encre2)}
.li.off .q,.li.off .nm{color:var(--encre2)}
.etat{display:flex;align-items:center;gap:5px;font-size:13px;line-height:17px;color:var(--encre2);letter-spacing:-.05px}
.barre{position:absolute;left:21px;right:21px;bottom:93px;height:50px;display:flex;gap:8px;z-index:50}
.barre>*{height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;white-space:nowrap;letter-spacing:-.3px}
.btn{height:52px;border-radius:26px;display:flex;align-items:center;justify-content:center;gap:9px;font-size:17px;font-weight:600;letter-spacing:-.3px}
.sec{background:var(--page2);color:var(--encre)}
.nt{font-size:34px;line-height:41px}
.kb{position:absolute;left:0;right:0;bottom:0;background:#D9DDD8;border-radius:26px 26px 0 0;z-index:65;padding:8px 5px 0}
.sombre .kb{background:#26302A}
.kb .r{display:flex;justify-content:center;gap:5px;margin-bottom:9px}
.kb .k{height:44px;border-radius:9px;background:#fff;display:grid;place-items:center;font-size:23px;flex:0 0 33.6px;letter-spacing:0;color:#12211A}
.sombre .kb .k{background:#56615A;color:#F0F5EC}
.kb .k.f{background:#C3C9C3}.sombre .kb .k.f{background:#3C473F}
.champ{border-radius:14px;box-shadow:inset 0 0 0 2px var(--persil)}
.cur{display:inline-block;width:2px;height:1.1em;background:var(--persil);vertical-align:-.15em;margin-left:1px}
.puce{height:44px;border-radius:22px;padding:0 15px;display:inline-flex;align-items:center;font-size:17px;font-weight:500;background:var(--page2);color:var(--encre);white-space:nowrap}
.puce.s{background:var(--persil);color:var(--surPersil);font-weight:600}
/* feuille */
.voile{position:absolute;inset:0;background:rgba(6,16,10,.42)}
.feuille{position:absolute;left:0;right:0;top:56px;bottom:0;background:var(--page);border-radius:38px 38px 0 0;overflow:hidden}
.st{font-size:20px;line-height:24px}
body.pc{background:#E6ECE0;width:3720px;padding:64px 72px 72px;color:#12211A}
.pc header{display:flex;align-items:baseline;gap:28px;margin-bottom:40px}.pc h1{font-size:104px;line-height:96px;color:#0F5B33}.pc header p{font-size:34px;line-height:40px}
.pc main{display:grid;grid-template-columns:repeat(8,417px);justify-content:space-between;row-gap:48px}
.pc .cadre{width:417px;height:876px;border:12px solid #0B0F0C;border-radius:68px;overflow:hidden;background:#0B0F0C}.pc .cadre .ec{border-radius:56px}
.pc figcaption{font-size:26px;line-height:30px;margin-top:14px;padding-left:12px}
.pc .ico{width:417px;height:876px}.pc .ico .g{width:417px;height:417px;border-radius:94px;display:block}
.pc .pt{display:flex;gap:18px;align-items:flex-end;margin-top:24px}.pc .pt img{width:150px;height:150px;border-radius:34px}.pc .pt img.xs{width:60px;height:60px;border-radius:13.5px}
.pc .sws{margin-top:30px;display:grid;row-gap:8px}.pc .sw{display:flex;align-items:center;height:34px}.pc .sw i{width:104px;height:34px}.pc .sw span{margin-left:18px;font-size:22px}

// ─── 1. Tirages ───────────────────────────────────────────────────────────────
// Graine : FNV-1a 64 bits. Tirage n : SplitMix64 à accès direct (état = graine + (n+1)·γ), donc un tirage ne dépend
// ni de l'ordre de dessin ni du nombre de pièces : agrandir le cadre ajoute des pièces sans changer les autres.
const M64=(1n<<64n)-1n, GAMMA=0x9e3779b97f4a7c15n;
function graine(s){let h=0xcbf29ce484222325n;for(const c of new TextEncoder().encode(s.toLowerCase())){h^=BigInt(c);h=(h*0x100000001b3n)&M64}return h}
function tirage(g,n){let z=(g+BigInt(n+1)*GAMMA)&M64;z=((z^(z>>30n))*0xbf58476d1ce4e5b9n)&M64;z=((z^(z>>27n))*0x94d049bb133111ebn)&M64;z^=z>>31n;return Number(z>>11n)/9007199254740992}
const rangPiece=j=>j>=0?2*j:-2*j-1;                                  // 0,-1,1,-2,2… → 0,1,2,3,4…
const rangGrille=(a,b)=>{const x=rangPiece(a),y=rangPiece(b);return (x+y)*(x+y+1)/2+y}; // appariement de Cantor

};

function oklab(h){const v=[1,3,5].map(i=>parseInt(h.substr(i,2),16)/255).map(c=>c<=.04045?c/12.92:((c+.055)/1.055)**2.4);const[r,g,b]=v;const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b),m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b),s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);return[.2104542553*l+.793617785*m-.0040720468*s,1.9779984951*l-2.428592205*m+.4505937099*s,.0259040371*l+.7827717662*m-.808675766*s]}
const ecart=(a,b)=>{const x=oklab(a),y=oklab(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};

const INVAR=new Set(['radis','noix','ananas','mais','anchois','pois','jus','riz','brebis','cassis','colis','couscous','houmous','os','frais','gros','bas']);
function normaliserNom(s){s=s.toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’'\-]/g,' ').replace(/\([^)]*\)/g,' ').replace(/[^a-z0-9% ]/g,' ').replace(/\s+/g,' ').trim();
 let m=s.split(' ');while(m.length>1&&['de','d','du','des','le','la','l','les'].includes(m[0]))m.shift();
 return m.map(w=>INVAR.has(w)||w.length<3?w:w.replace(/eaux$/,'eau').replace(/[sx]$/,'')).join(' ')}
const DICO=new Map(DICO_SRC.split('|').map(l=>{const[k,v,c,m]=l.split(':');return[normaliserNom(k),{v,c,m:+m,k}]}));
const EXCLUS=EXCLUS_SRC.split('|').map(normaliserNom);
const contient=(n,k)=>(' '+n+' ').includes(' '+k+' ');
/* plus longue clé en mots entiers ; à longueur égale, la plus à gauche. Une exclusion gagne si elle commence avant la clé,
   ou au même endroit en étant au moins aussi longue : « huile d’olive » écarté, « oignon piqué de clous de girofle » dessiné. */
function reconnaitre(nom){const n=normaliserNom(nom);let best=null,lg=0,pos=1e9;
 for(const[k,e]of DICO)if(contient(n,k)){const p=(' '+n+' ').indexOf(' '+k+' ');if(k.length>lg||(k.length===lg&&p<pos)){best=e;lg=k.length;pos=p}}
 for(const k of EXCLUS)if(contient(n,k)){const p=(' '+n+' ').indexOf(' '+k+' ');if(!best||p<pos||(p===pos&&k.length>=lg))return{exclu:true}}
 return best?{v:best.v,c:best.c,m:best.m,cle:best.k}:null}
